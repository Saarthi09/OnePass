# The whole OnePass project is one Cargo "workspace": a folder of related Rust
# programs that share dependencies. Each piece of OnePass is a member.
[workspace]
resolver = "2"
members = [
    "core",     # signing and checking facts (shared by the other two)
    "sources",  # stand-in institutions: university, bank, housing agency
    "server",   # OnePass itself, plus the demo company pages
]
