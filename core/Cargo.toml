[package]
name = "onepass-core"
version = "0.1.0"
edition = "2021"
description = "Signing and checking facts: shared by the institutions and the OnePass server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"         # digital signatures (same kind Stellar uses)
stellar-strkey = "0.0.13"   # writes public keys in Stellar's "G..." format
sha2 = "0.10"               # hashing
base64 = "0.22"
