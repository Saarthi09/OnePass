<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnePass: approve request</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a class="brand" href="/">OnePass</a>
    <span class="who">Signed in as Alex Rivera (demo)</span>
  </header>
  <main id="page"><p class="sub">Loading…</p></main>

  <script src="/app.js"></script>
  <script>
    const page = document.getElementById("page");
    const requestId = lastPathPart();

    async function load() {
      let request;
      try { request = await api("/api/requests/" + requestId); }
      catch (e) { page.replaceChildren(el("p", { class: "error" }, e.message)); return; }

      const c = request.company;
      const back = "/company/" + c.id + "?request=" + request.id;
      if (request.status !== "pending") { location.href = back; return; }

      const error = el("p", { class: "error" });
      const boxes = [];
      const rows = request.items.map((item) => {
        if (!item.fact) {
          // OnePass could not find this fact: no institution of the right kind is connected.
          return el("div", { class: "row" },
            el("div", { class: "grow" },
              el("div", { class: "label" }, label(item.field)),
              el("div", { class: "value bad" }, "Not available"),
              el("div", { class: "meta" }, "Connect a " + item.kind + " first.")));
        }
        const box = el("input", { type: "checkbox", id: "f-" + item.field, value: item.field });
        box.checked = true;
        boxes.push(box);
        return el("div", { class: "row" },
          box,
          el("label", { class: "grow", for: "f-" + item.field },
            el("div", { class: "label" }, label(item.field)),
            el("div", { class: "value" }, show(item.fact.value)),
            el("div", { class: "meta" }, "From " + item.source_name + ", digitally signed")));
      });

      const tamper = el("input", { type: "checkbox", id: "tamper" });
      const missing = request.items.some((i) => !i.fact);

      page.replaceChildren(
        el("h1", {}, c.name + " is asking for your information"),
        el("p", { class: "sub" }, "Untick anything you do not want to share. Nothing is sent until you approve."),
        el("div", { class: "card" }, rows),
        missing && el("p", { class: "meta" }, "Some information is missing. ", el("a", { href: "/" }, "Connect an institution"), " and try again."),
        error,
        el("div", { class: "actions" },
          el("button", { onclick: async () => {
            try {
              await api("/api/requests/" + request.id + "/approve", {
                fields: boxes.filter((b) => b.checked).map((b) => b.value),
                tamper: tamper.checked,
              });
              location.href = back;
            } catch (e) { error.textContent = e.message; }
          } }, "Approve and share"),
          el("button", { class: "danger", onclick: async () => {
            await api("/api/requests/" + request.id + "/deny", {});
            location.href = back;
          } }, "Deny"),
          el("label", { class: "tamper", for: "tamper" }, tamper, "Demo: alter a fact in transit")));
    }
    load();
  </script>
</body>
</html>
