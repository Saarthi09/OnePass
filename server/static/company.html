<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo company</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a class="brand" href="#" id="brand">Company</a>
    <span class="who">Demo company site (invented)</span>
  </header>
  <main id="page"><p class="sub">Loading…</p></main>

  <script src="/app.js"></script>
  <script>
    const page = document.getElementById("page");
    const companyId = lastPathPart();
    let requestId = new URLSearchParams(location.search).get("request");
    let company;
    let timer;

    const tick = (passed) => el("span", { class: passed ? "ok" : "bad" }, passed ? "✓" : "✗");

    // The Stellar receipt line under a completed request.
    function receiptLine(receipt) {
      if (!receipt) return null;
      const short = receipt.fingerprint.slice(0, 16) + "…";
      if (receipt.status === "recorded") return el("div", { class: "row" }, el("div", { class: "grow" },
        tick(true), " Receipt recorded on Stellar ", el("code", {}, short),
        el("div", { class: "meta" }, "A permanent, timestamped fingerprint of this verification. It contains no personal information.")));
      if (receipt.status === "pending") return el("div", { class: "row" }, el("div", { class: "waiting" },
        el("span", { class: "dot" }), "Recording a receipt on Stellar… ", el("code", {}, short)));
      return el("div", { class: "row" }, el("div", { class: "grow" },
        "Receipt not recorded on Stellar. ", el("span", { class: "meta" }, receipt.detail || "")));
    }

    // What the company shows once the person has answered in OnePass.
    function result(request) {
      const c = request.company;
      if (request.status === "denied") {
        return [el("div", { class: "banner bad" }, "The person declined. Nothing was sent to " + c.name + ".")];
      }
      if (request.status === "refused") {
        return [el("div", { class: "banner bad" }, "OnePass could not verify this information, so nothing was sent to " + c.name + ".")];
      }
      const v = request.verdict;
      const keyOnRegistry = v.checks.some((check) => check.signer_is_onepass);
      return [
        el("div", { class: "banner " + (v.ok ? "ok" : "bad") }, v.ok ? "✓ " + c.success : "✗ Verification failed. " + c.name + " did not accept this."),
        el("div", { class: "card" },
          el("h3", {}, "What " + c.name + " received"),
          v.checks.map((check) => el("div", { class: "row" },
            el("div", { class: "grow" },
              el("div", { class: "label" }, label(check.field)),
              el("div", { class: "value" }, check.received ? show(check.value) : "Not shared"),
              check.received && el("div", { class: "meta" },
                tick(check.ok), " ",
                check.ok ? "Verified by OnePass"
                  : !check.signature_ok ? "OnePass's stamp does not match (the fact was altered)"
                  : "Signed by a key that is not OnePass's registered key")))),
          el("p", { class: "meta" }, c.name + " was not told which institution any of this came from.")),
        el("div", { class: "card" },
          el("h3", {}, "How " + c.name + " knows this is genuine"),
          el("div", { class: "row" }, el("div", { class: "grow" },
            tick(keyOnRegistry), keyOnRegistry ? " The stamp was made with OnePass's key, as listed on " : " The signing key was not found on ",
            v.registry_url ? el("a", { href: v.registry_url, target: "_blank", rel: "noreferrer" }, v.registry) : v.registry)),
          receiptLine(request.receipt)),
      ];
    }

    function render(request) {
      const c = company;
      const error = el("p", { class: "error" });
      const hero = el("div", { class: "company-hero" },
        el("h1", {}, c.name),
        el("p", {}, c.tagline),
        el("button", { onclick: async () => {
          try {
            const { id } = await api("/api/requests", { company_id: c.id });
            requestId = id;
            history.replaceState(null, "", "?request=" + id);
            watch();
          } catch (e) { error.textContent = e.message; }
        } }, c.action + " with OnePass"));

      const parts = [hero, error];
      if (!request) {
        parts.push(el("p", { class: "meta" }, c.name + " will ask OnePass for: " + c.wants.map(label).join(", ") + "."));
      } else if (request.status === "pending") {
        parts.push(el("div", { class: "card waiting" }, el("span", { class: "dot" }),
          el("div", {}, el("strong", {}, "Request sent to OnePass."), " Waiting for Alex Rivera to approve it. ",
            el("div", { class: "meta" }, "Asked for: " + c.wants.map(label).join(", ")))));
      } else {
        parts.push(...result(request));
      }
      fill(page, parts);
    }

    // Keep checking the request until it is answered and its receipt is settled.
    async function watch() {
      clearTimeout(timer);
      let request = null;
      if (requestId) {
        try { request = await api("/api/requests/" + requestId); } catch { request = null; }
      }
      render(request);
      const unsettled = request && (request.status === "pending" || (request.receipt && request.receipt.status === "pending"));
      if (unsettled) timer = setTimeout(watch, 1500);
    }

    async function start() {
      const { companies } = await api("/api/companies");
      company = companies.find((x) => x.id === companyId);
      if (!company) { fill(page, el("p", { class: "error" }, "No such company.")); return; }
      document.title = company.name;
      document.getElementById("brand").textContent = company.name;
      watch();
    }
    start();
  </script>
</body>
</html>
