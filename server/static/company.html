<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo company</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a class="brand" href="/" id="brand">Company</a>
    <span class="who">Demo company site (invented)</span>
  </header>
  <main id="page"><p class="sub">Loading…</p></main>

  <script src="/app.js"></script>
  <script>
    const page = document.getElementById("page");
    const companyId = lastPathPart();
    const requestId = new URLSearchParams(location.search).get("request");

    // What the company shows once the user has answered in OnePass.
    function result(request) {
      const c = request.company;
      if (request.status === "denied") {
        return [el("div", { class: "banner bad" }, "You chose not to share. Nothing was sent to " + c.name + ".")];
      }
      const v = request.verdict;
      const tick = (passed) => el("span", { class: passed ? "ok" : "bad" }, passed ? "✓" : "✗");
      return [
        el("div", { class: "banner " + (v.ok ? "ok" : "bad") }, v.ok ? "✓ " + c.success : "✗ Verification failed. " + c.name + " did not accept this."),
        el("div", { class: "card" },
          el("h3", {}, "What " + c.name + " received and checked"),
          v.checks.map((check) => el("div", { class: "row" },
            el("div", { class: "grow" },
              el("div", { class: "label" }, label(check.field)),
              el("div", { class: "value" }, check.received ? show(check.value) : "Not shared"),
              check.received && el("div", { class: "meta" },
                tick(check.signature_ok), check.signature_ok ? " Signature genuine" : " Signature does not match (altered)", "  ·  ",
                tick(check.source_trusted), check.source_trusted ? " Signed by " + check.source_name : " Signer not on the registry",
                check.source_trusted && !check.right_kind ? "  ·  ✗ Wrong kind of institution" : ""))))),
        el("p", { class: "meta" }, "Registry checked: ",
          v.registry_url ? el("a", { href: v.registry_url, target: "_blank", rel: "noreferrer" }, v.registry) : v.registry),
      ];
    }

    async function load() {
      const { companies } = await api("/api/companies");
      const c = companies.find((x) => x.id === companyId);
      if (!c) { page.replaceChildren(el("p", { class: "error" }, "No such company.")); return; }
      document.title = c.name;
      document.getElementById("brand").textContent = c.name;

      const error = el("p", { class: "error" });
      const hero = el("div", { class: "company-hero" },
        el("h1", {}, c.name),
        el("p", {}, c.tagline),
        el("button", { onclick: async () => {
          try {
            const { id } = await api("/api/requests", { company_id: c.id });
            location.href = "/approve/" + id;   // hand over to OnePass for approval
          } catch (e) { error.textContent = e.message; }
        } }, c.action + " with OnePass"));

      const parts = [hero, error];
      if (requestId) {
        try { parts.push(...result(await api("/api/requests/" + requestId))); }
        catch (e) { error.textContent = e.message; }
      } else {
        parts.push(el("p", { class: "meta" }, c.name + " will ask OnePass for: " +
          c.wants.map((w) => label(w.field) + " (from a " + w.kind + ")").join(", ") + "."));
      }
      parts.push(el("div", { class: "actions" }, el("a", { class: "button secondary", href: "/" }, "Back to OnePass")));
      page.replaceChildren(...parts);
    }
    load();
  </script>
</body>
</html>
